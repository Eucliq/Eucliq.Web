name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v9
        with:
          stale-issue-message: "This issue has been automatically marked as stale because it has had no activity for 30 days. It will be closed in 7 days if no further activity occurs."
          stale-pr-message: "This pull request has been automatically marked as stale because it has had no activity for 30 days. It will be closed in 7 days if no further activity occurs."
          close-issue-message: "This issue was automatically closed due to inactivity."
          close-pr-message: "This pull request was automatically closed due to inactivity."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          remove-stale-when-updated: true
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
